<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choose a Category</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container mt-5">
    <div class="card mx-auto" style="max-width: 450px;">
      <div class="card-body text-center">

        <h2 class="mb-4">Choose a Category</h2>

        <!-- 🎬 Entertainment -->
        <h4 class="mt-3">🎬 Entertainment</h4>
        <a href="setup.html?category=movies"><button class="btn btn-outline-primary w-100 mb-2">Movies</button></a>
        <a href="setup.html?category=tv"><button class="btn btn-outline-primary w-100 mb-2">TV Shows</button></a>
        <a href="setup.html?category=celebrities"><button class="btn btn-outline-primary w-100 mb-2">Famous People</button></a>
        <a href="setup.html?category=games"><button class="btn btn-outline-primary w-100 mb-3">Video Games</button></a>

        <!-- 🌍 Real World -->
        <h4 class="mt-3">🌍 Real World</h4>
        <a href="setup.html?category=countries"><button class="btn btn-outline-success w-100 mb-2">Countries</button></a>
        <a href="setup.html?category=cities"><button class="btn btn-outline-success w-100 mb-2">Cities</button></a>
        <a href="setup.html?category=landmarks"><button class="btn btn-outline-success w-100 mb-2">Landmarks</button></a>
        <a href="setup.html?category=jobs"><button class="btn btn-outline-success w-100 mb-3">Jobs</button></a>

        <!-- 🧠 Brainy Categories -->
        <h4 class="mt-3">🧠 Brainy Categories</h4>
        <a href="setup.html?category=science"><button class="btn btn-outline-warning w-100 mb-2">Science Terms</button></a>
        <a href="setup.html?category=legal"><button class="btn btn-outline-warning w-100 mb-2">Legal Terms</button></a>
        <a href="setup.html?category=medical"><button class="btn btn-outline-warning w-100 mb-2">Medical Terms</button></a>
        <a href="setup.html?category=technology"><button class="btn btn-outline-warning w-100 mb-3">Technology</button></a>

        <!-- 🍔 Everyday Stuff -->
        <h4 class="mt-3">🍔 Everyday Stuff</h4>
        <a href="setup.html?category=food"><button class="btn btn-outline-info w-100 mb-2">Food & Drinks</button></a>
        <a href="setup.html?category=clothing"><button class="btn btn-outline-info w-100 mb-2">Clothing Brands</button></a>
        <a href="setup.html?category=school"><button class="btn btn-outline-info w-100 mb-2">School Subjects</button></a>
        <a href="setup.html?category=sports"><button class="btn btn-outline-info w-100 mb-3">Sports</button></a>

        <!-- 🎮 Game-Friendly -->
        <h4 class="mt-3">🎮 Game-Friendly</h4>
        <a href="setup.html?category=longwords"><button class="btn btn-outline-dark w-100 mb-2">Long Words</button></a>
        <a href="setup.html?category=shortwords"><button class="btn btn-outline-dark w-100 mb-2">Short Words</button></a>
        <a href="setup.html?category=difficult"><button class="btn btn-outline-dark w-100 mb-2">Difficult Words</button></a>
        <a href="setup.html?category=compound"><button class="btn btn-outline-dark w-100 mb-3">Compound Words</button></a>

      </div>
    </div>
  </main>
</body>
</html>
