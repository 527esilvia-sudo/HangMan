<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choose a Category</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container mt-5">
    <!-- category-card is what your CSS targets -->
    <div class="card category-card mx-auto" style="max-width: 450px;">
      <div class="card-body text-center">

        <h2 class="mb-4">Choose a Category</h2>

        <!-- 🎬 Entertainment -->
        <h4 class="mt-3">🎬 Entertainment</h4>
        <button class="btn btn-outline-primary w-100 mb-2"
          onclick="location.href='setup.html?category=movies'">Movies</button>
        <button class="btn btn-outline-primary w-100 mb-2" onclick="location.href='setup.html?category=tv'">TV
          Shows</button>
        <button class="btn btn-outline-primary w-100 mb-2"
          onclick="location.href='setup.html?category=celebrities'">Famous People</button>
        <button class="btn btn-outline-primary w-100 mb-3" onclick="location.href='setup.html?category=games'">Video
          Games</button>

        <!-- 🌍 Real World -->
        <h4 class="mt-3">🌍 Real World</h4>
        <button class="btn btn-outline-success w-100 mb-2"
          onclick="location.href='setup.html?category=countries'">Countries</button>
        <button class="btn btn-outline-success w-100 mb-2"
          onclick="location.href='setup.html?category=cities'">Cities</button>
        <button class="btn btn-outline-success w-100 mb-2"
          onclick="location.href='setup.html?category=landmarks'">Landmarks</button>
        <button class="btn btn-outline-success w-100 mb-3"
          onclick="location.href='setup.html?category=jobs'">Jobs</button>

        <!-- 🧠 Brainy Categories -->
        <h4 class="mt-3">🧠 Brainy Categories</h4>
        <button class="btn btn-outline-warning w-100 mb-2" onclick="location.href='setup.html?category=science'">Science
          Terms</button>
        <button class="btn btn-outline-warning w-100 mb-2" onclick="location.href='setup.html?category=legal'">Legal
          Terms</button>
        <button class="btn btn-outline-warning w-100 mb-2" onclick="location.href='setup.html?category=medical'">Medical
          Terms</button>
        <button class="btn btn-outline-warning w-100 mb-3"
          onclick="location.href='setup.html?category=technology'">Technology</button>

        <!-- 🍔 Everyday Stuff -->
        <h4 class="mt-3">🍔 Everyday Stuff</h4>
        <button class="btn btn-outline-info w-100 mb-2" onclick="location.href='setup.html?category=food'">Food &
          Drinks</button>
        <button class="btn btn-outline-info w-100 mb-2" onclick="location.href='setup.html?category=clothing'">Clothing
          Brands</button>
        <button class="btn btn-outline-info w-100 mb-2" onclick="location.href='setup.html?category=school'">School
          Subjects</button>
        <button class="btn btn-outline-info w-100 mb-3"
          onclick="location.href='setup.html?category=sports'">Sports</button>

        <!-- 🎮 Game-Friendly -->
        <h4 class="mt-3">🎮 Game-Friendly</h4>
        <button class="btn btn-outline-dark w-100 mb-2" onclick="location.href='setup.html?category=longwords'">Long
          Words</button>
        <button class="btn btn-outline-dark w-100 mb-2" onclick="location.href='setup.html?category=shortwords'">Short
          Words</button>
        <button class="btn btn-outline-dark w-100 mb-2"
          onclick="location.href='setup.html?category=difficult'">Difficult Words</button>
        <button class="btn btn-outline-dark w-100 mb-3" onclick="location.href='setup.html?category=compound'">Compound
          Words</button>

      </div>
    </div>
  </main>
</body>

</html>
