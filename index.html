<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hangman Setup</title>
  <!-- Google Fonts: Roboto Mono and IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">

    <div class="setup-wrapper">
      <div class="card">
        <div class="card-body text-center">

          <h2 class="mb-3">Choose Difficulty</h2>

          <a href="setup.html?mode=easy"><button class="btn-easy mb-2">Easy</button></a>
          <p id="easyHighScore">High Score: 0</p>

          <a href="setup.html?mode=medium"><button class="btn-medium mb-2">Medium</button></a>
          <p id="mediumHighScore">High Score: 0</p>

          <a href="setup.html?mode=hard"><button class="btn-hard mb-2">Hard</button></a>
          <p id="hardHighScore">High Score: 0</p>

          <a href="setup.html?mode=random"><button class="btn-random mb-2">Random</button></a>
          <p id="randomHighScore">High Score: 0</p>

          <h1>OR</h1>

          <a href="category.html"><button class="btn-category">Choose a Category</button></a>

        </div>
      </div>
    </div>

  </main>

</body>

</html>
