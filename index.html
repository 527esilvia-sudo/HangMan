<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hangman - Base (Bootstrap)</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="bg-light py-3 mb-3">
    <div class="container">
      <h1 class="m-0">Hangman</h1>
    </div>
  </header>

  <main class="container">
    <div class="row g-4">
      <!-- Left column: controls -->
      <aside class="col-12 col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Difficulty</h5>
            <div class="d-flex gap-2 mb-3">
              <button id="easy" class="btn btn-success flex-fill">Easy</button>
              <button id="medium" class="btn btn-warning flex-fill">Medium</button>
              <button id="hard" class="btn btn-danger flex-fill">Hard</button>
            </div>

            <button id="custom" class="btn btn-outline-primary w-100">Make it your own</button>

            <hr>
            <div>
              <h6>Guesses</h6>
              <p id="attemptsLeft">Attempts Left <span id="remaining-count">6</span></p>
              <p id="guessedLetters">Guessed: </p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right column: game area -->
      <section class="col-12 col-md-8">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-12 col-lg-6 d-flex justify-content-center align-items-start mb-3 mb-lg-0">
                <!-- Hangman stage: gallows + body-part containers for images -->
                <div id="hangman" class="hangman-stage">
                  <!-- simple gallows (kept as SVG for crisp lines) -->
                  <svg viewBox="0 0 200 250" width="260" height="340" aria-hidden="true">
                    <line x1="10" y1="240" x2="150" y2="240" stroke="#333" stroke-width="4" />
                    <line x1="40" y1="20" x2="40" y2="240" stroke="#333" stroke-width="4" />
                    <line x1="40" y1="20" x2="120" y2="20" stroke="#333" stroke-width="4" />
                    <line x1="120" y1="20" x2="120" y2="40" stroke="#333" stroke-width="4" />
                  </svg>

                  <!-- Body-part containers: place images inside these divs (hidden by default) -->
                  <div id="head" class="man-part head">
                    <img src="" alt="head" />
                  </div>

                  <div id="body" class="man-part body">
                    <img src="" alt="body" />
                  </div>

                  <div id="armL" class="man-part arm arm-left">
                    <img src="" alt="left arm" />
                  </div>

                  <div id="armR" class="man-part arm arm-right">
                    <img src="" alt="right arm" />
                  </div>

                  <div id="legL" class="man-part leg leg-left">
                    <img src="" alt="left leg" />
                  </div>

                  <div id="legR" class="man-part leg leg-right">
                    <img src="" alt="right leg" />
                  </div>
                </div>
              </div>

              <div class="col-12 col-lg-6">
                <div class="mb-3">
                  <h5 class="mb-2">Word</h5>
                  <div id="wordDisplay" class="fs-3">_ _ _ _ _</div>                  
                  <div id="gameOverMessage" class="mt-3" ></div>  Game Over! </div>

                <div>
                  <h6 class="mb-2">Letters</h6>
                  <form class="row g-3"  onsubmit="return false" autocomplete="off">
                    <div class="col-auto">
                      <input type="text" class="form-control" id="letterInput" placeholder="Guess a letter">
                      <h3 id="warning" class="warning text-warning">Please guess a letter</h3>
                    </div>
                 <button class="btn btn-outline-primary" onclick="guessLetter()">GUESS</button>
                </div>
              </div>
            </div>
          </div>
        </div>
    </div>
    </section>
    </div>
  </main>

  <!-- Optional script placeholder -->
  <script src="script.js"></script>
</body>

</html>
