<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hangman - Base (Bootstrap)</title>
  <!-- Google Fonts: Roboto Mono and IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Typekit CSS for shlop font -->
  <link rel="stylesheet" href="https://use.typekit.net/zhc0xvy.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>


<body>

  <!-- Confetti container OUTSIDE layout -->
  <div id="confetti-container"></div>

  <main>
    
    <div>
       
<div id="statsContainer">
    <p id="totalWins">Wins: </p>
    <p id="streakDisplay">Streak: </p>
    <p id="highestStreak">Highest Streak: </p>
</div>
      <div id="hangman" class="hangman-stage" style="margin: 2rem auto;">
        <div id="stages">
          <img id="stagesImg" src="Untitled-1.png">
        </div>
      </div>

      <div style="margin-top: 1rem; text-align: center;">
        <p class="mb-2">Attempts Left: <span id="remaining-count">8</span></p>
        <p id="guessedLetters" class="mb-3">Guessed: </p>

        <div id="wordDisplay" class="fs-3 mb-3">_ _ _ _ _</div>
        <div id="gameOverMessage" class="mb-3"></div>

        <div class="input-buttons-container">
          <input type="text" class="form-control" id="letterInput" placeholder="Guess a letter" maxlength="1">
          <button class="btn-primary" onclick="guessLetter()">GUESS</button>
          <button class="btn-secondary" onclick="startGame()">Restart</button>
        </div>

        <h3 id="warning" class="warning mt-2">Please guess a letter</h3>
      </div>

    </div>
  </main>
<div class="danger-mode"></div>
  <script src="script.js"></script>
</body>


</html>
