<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hangman - Base (Bootstrap)</title>
  <!-- Google Fonts: Roboto Mono and IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Typekit CSS for shlop font -->
  <link rel="stylesheet" href="https://use.typekit.net/zhc0xvy.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<body>
  <main class="container">
    <div class="text-center">
      <div id="hangman" class="hangman-stage mx-auto mb-4 mt-5">
        <div id="stages" class="">
          <img id="stagesImg" src="Untitled-1.png">
        </div>
      </div>
      <div id="confetti-container"></div>
      <div class="mt-3">
        <p class="mb-2">Attempts Left: <span id="remaining-count">8</span></p>
        <p id="guessedLetters" class="mb-3">Guessed: </p>
        <div id="wordDisplay" class="fs-3 mb-3">_ _ _ _ _</div>
        <div id="gameOverMessage" class="mb-3"></div>
        <div class="d-inline-flex gap-2 align-items-center">
          <input type="text" class="form-control" id="letterInput" placeholder="Guess a letter" maxlength="1" style="width: auto;">
          <button class="btn btn-primary" onclick="guessLetter()">GUESS</button>
          <button onclick="startGame()" class="btn btn-secondary">Restart</button>
        </div>
        <h3 id="warning" class="warning text-warning mt-2">Please guess a letter</h3>
      </div>
    </div>
  </main>

  <!-- Optional script placeholder -->
  <script src="script.js"></script>
</body>

</html>
